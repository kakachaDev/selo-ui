[package]
name = "selo-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["kakachaDev <dev@kakacha.space>"]
description = "Tiny game UI for wgpu: anchors, multitouch input, SDF shapes and glyph-atlas text in one draw pass"
readme = "README.md"
repository = "https://github.com/kakachaDev/selo-ui"
homepage = "https://github.com/kakachaDev/selo-ui"
documentation = "https://docs.rs/selo-ui"
keywords = ["ui", "gamedev", "wgpu", "touch", "wasm"]
categories = ["gui", "game-development", "rendering", "wasm"]
exclude = ["images/"]

[lib]
name = "selo"

[dependencies]
ab_glyph = "0.2"
bytemuck = "1.25"
wgpu = { version = "30", default-features = false, features = ["wgsl", "std"] }

[dev-dependencies]
wgpu = { version = "30" }
winit = "0.30"
pollster = "1"
png = "0.18"
